/* Scrub the Review frame strip by dragging anywhere along it. Delegated once here rather than
   per-cell: at phone width each of the 30 bars is about 4px, far below a usable touch target,
   so the input is the position along the strip, not which bar was hit. Pointer capture keeps
   the drag alive when the finger leaves the strip vertically. */
(function(){
  let dragEl=null;
  /* Map the pointer to the NEAREST cell rather than to a fraction of the strip.
     The cells are separated by 2px gaps, so a fraction of the total width drifts
     from the cell you are actually over — by the far end that is a whole frame
     out, which is what made the strip feel like it was fighting you. Nearest-cell
     also means a press just past either end still picks the end frame. */
  const idxAt=(el,x)=>{
    const cells=el.querySelectorAll('[data-cell]');
    if(!cells.length){
      const r=el.getBoundingClientRect();
      return r.width ? app.poseFromFraction((x-r.left)/r.width) : -1;
    }
    let best=-1, bd=Infinity;
    for(let k=0;k<cells.length;k++){
      const r=cells[k].getBoundingClientRect();
      const d=Math.abs(x-(r.left+r.width/2));
      if(d<bd){ bd=d; best=+cells[k].getAttribute('data-cell'); }
    }
    if(best>=0) app.applyPose(best);
    return best;
  };
  /* Flick across the pose itself. This is the gesture people already use on a
     photo viewer, and on a phone it is the only comfortable one: the rail is
     6px of a 44px row, while the pose is half the screen. One frame per ~14px
     of travel, so a full swipe crosses a 30-frame take without lifting off. */
  let swipeEl=null, swipeX=0, swipeFrom=0, swipeMoved=false;
  const SWIPE_PX=14;
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('[data-poseswipe]'); if(!el) return;
    if(!(+el.getAttribute('data-n')||0)) return;
    swipeEl=el; swipeX=e.clientX; swipeMoved=false;
    const f=app.state.poseFrame;
    swipeFrom=(typeof f==='number'&&f>=0)?f:0;
    try{ el.setPointerCapture&&el.setPointerCapture(e.pointerId); }catch(_){}
  });
  root.addEventListener('pointermove',e=>{
    if(!swipeEl || tEl) return;               // a touch drag owns this gesture
    const n=+swipeEl.getAttribute('data-n')||0; if(!n) return;
    const steps=Math.trunc((e.clientX-swipeX)/SWIPE_PX);
    if(!steps && !swipeMoved) return;
    swipeMoved=true;
    e.preventDefault();
    app.applyPose(Math.max(0,Math.min(n-1, swipeFrom+steps)));
  });
  /* Pointer events alone were not enough on a phone. touch-action:pan-y tells
     the browser we want horizontal gestures, but the moment a swipe carries any
     vertical component the browser can still claim it as a scroll and fire
     pointercancel — so the swipe "just scrolled". Handling touchmove directly
     and cancelling it once the gesture is clearly sideways is what makes the
     two gestures separable: across = frames, down = the page. */
  let tX=0, tY=0, tFrom=0, tEl=null, tAxis=0;   // axis: 0 undecided, 1 scrub, -1 scroll
  root.addEventListener('touchstart',e=>{
    const t=e.touches&&e.touches[0]; if(!t) return;
    const el=t.target.closest&&t.target.closest('[data-poseswipe]');
    tEl=(el && (+el.getAttribute('data-n')||0)) ? el : null;
    if(!tEl) return;
    tX=t.clientX; tY=t.clientY; tAxis=0;
    const f=app.state.poseFrame;
    tFrom=(typeof f==='number'&&f>=0)?f:0;
  },{passive:true});
  root.addEventListener('touchmove',e=>{
    if(!tEl) return;
    const t=e.touches&&e.touches[0]; if(!t) return;
    const dx=t.clientX-tX, dy=t.clientY-tY;
    if(!tAxis){
      if(Math.abs(dx)<6 && Math.abs(dy)<6) return;    // too small to call yet
      tAxis = Math.abs(dx) > Math.abs(dy) ? 1 : -1;
    }
    if(tAxis<0) return;                                // it's a scroll; leave it alone
    e.preventDefault();                                // it's a scrub; the page must not move
    const n=+tEl.getAttribute('data-n')||0;
    app.applyPose(Math.max(0,Math.min(n-1, tFrom+Math.trunc(dx/SWIPE_PX))));
  },{passive:false});
  const endTouch=()=>{ tEl=null; tAxis=0; };
  root.addEventListener('touchend',endTouch);
  root.addEventListener('touchcancel',endTouch);
  const endSwipe=()=>{ swipeEl=null; };
  root.addEventListener('pointerup',endSwipe);
  root.addEventListener('pointercancel',endSwipe);
  window.addEventListener('pointerup',endSwipe);
  /* Desktop equivalent: a trackpad flick or a wheel over the pose. Deltas arrive
     in wildly different units per device, so accumulate and spend a frame each
     time the total crosses a threshold rather than trusting one event. */
  let wheelAcc=0;
  root.addEventListener('wheel',e=>{
    const el=e.target.closest&&e.target.closest('[data-poseswipe]'); if(!el) return;
    const n=+el.getAttribute('data-n')||0; if(!n) return;
    /* Only a SIDEWAYS wheel scrubs. Hijacking the vertical one meant the page
       stopped scrolling whenever the cursor happened to be over the pose, which
       is exactly the "it just scrolls / it won't scroll" confusion in reverse. */
    if(Math.abs(e.deltaX)<=Math.abs(e.deltaY)) return;
    wheelAcc+=e.deltaX;
    const steps=Math.trunc(wheelAcc/28);
    if(!steps) { e.preventDefault(); return; }
    wheelAcc-=steps*28;
    const f=app.state.poseFrame;
    const cur=(typeof f==='number'&&f>=0)?f:0;
    app.applyPose(Math.max(0,Math.min(n-1,cur+steps)));
    e.preventDefault();
  },{passive:false});
  /* Hold an arrow to run. This is the key-repeat pattern every text field and
     stepper uses: one press does one step, then after a pause it repeats, and
     the repeat speeds up once you have clearly settled in for a long run. A
     30-frame take is short, but a 300-frame one would be tedious a tap at a
     time. Any [data-hold] control gets this — it reads the action straight off
     the button, so nothing has to be registered twice. */
  let holdTo=null, holdInt=null;
  const stopHold=()=>{ if(holdTo){clearTimeout(holdTo); holdTo=null;}
                       if(holdInt){clearInterval(holdInt); holdInt=null;} };
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('[data-hold]'); if(!el) return;
    const fn=app._acts[+el.getAttribute('data-act')];
    if(typeof fn!=='function') return;
    stopHold();
    holdTo=setTimeout(()=>{
      let ticks=0;
      const run=(ms)=>{ if(holdInt) clearInterval(holdInt);
        holdInt=setInterval(()=>{
          try{ fn(); }catch(_){ stopHold(); return; }
          if(++ticks===12) run(38);        // settled in: go faster
        }, ms); };
      run(85);
    }, 420);
  });
  ['pointerup','pointercancel','pointerleave','blur'].forEach(ev=>{
    root.addEventListener(ev, stopHold, true);
  });
  window.addEventListener('pointerup', stopHold);
  /* Keyboard is the precise input: one press, one frame, no aiming. */
  root.addEventListener('keydown',e=>{
    const el=e.target.closest&&e.target.closest('[data-posestrip]'); if(!el) return;
    const n=+(el.getAttribute('data-n')||0); if(!n) return;
    const cur=(typeof app.state.poseFrame==='number' && app.state.poseFrame>=0) ? app.state.poseFrame : 0;
    let to=null;
    if(e.key==='ArrowLeft'||e.key==='ArrowDown') to=cur-1;
    else if(e.key==='ArrowRight'||e.key==='ArrowUp') to=cur+1;
    else if(e.key==='Home') to=0;
    else if(e.key==='End') to=n-1;
    else return;
    e.preventDefault();
    app.applyPose(Math.max(0,Math.min(n-1,to)));
  });
  root.addEventListener('pointerdown',e=>{
    const el=e.target.closest&&e.target.closest('[data-posestrip]'); if(!el) return;
    dragEl=el;
    try{ el.setPointerCapture&&el.setPointerCapture(e.pointerId); }catch(_){}
    idxAt(el,e.clientX); e.preventDefault();
  });
  root.addEventListener('pointermove',e=>{ if(dragEl) idxAt(dragEl,e.clientX); });
  const end=()=>{ dragEl=null; };
  root.addEventListener('pointerup',end);
  root.addEventListener('pointercancel',end);
  window.addEventListener('pointerup',end);
})();
const mq=window.matchMedia('(max-width:820px)');
const onMQ=()=>{ const d=mq.matches?'mobile':'desktop'; if(d!==app.state.device) app.setState({device:d}); };
mq.addEventListener? mq.addEventListener('change',onMQ) : mq.addListener(onMQ);
window.addEventListener('resize',onMQ,{passive:true});
app.render();
/* No eager start: attach() acquires the camera the first time a surface
   actually shows a camera panel, so the light never comes on for Home. */
if(!Consent.granted()) Consent.show(()=>app.render());
})();

</script>
<script>
/* ============================================================================
   Engine bridge.

   index.html's recogniser is included verbatim: it owns MediaPipe, the camera
   stream, the k-NN model and all the fili logic, and it writes its results into
   the hidden #engineDom scaffold. This mirrors those values into the design's
   marked nodes.

   Mirroring rather than re-rendering: the engine updates ~30x a second and the
   app renders by replacing innerHTML, so driving state per frame would repaint
   the entire page every frame. The bridge touches five nodes instead.
   ========================================================================== */
(function(){
  const $$=id=>document.getElementById(id);
  /* the engine unlocks #start once MediaPipe AND the letter data have loaded */
  function engineReady(timeout){
    const btn=$$('start'); const t0=Date.now(); const lim=timeout||25000;
    return new Promise(res=>{
      (function poll(){
        const ready = btn && !btn.disabled;
        const hasHands = (typeof hands!=='undefined') && !!hands;
        if(ready || hasHands || Date.now()-t0>lim) return res(ready||hasHands);
        setTimeout(poll,120);
      })();
    });
  }

  /* Node lookups are cached and rebuilt only when the app re-renders. The
     mirror runs on every animation frame alongside the engine's own pump, and
     a dozen querySelectorAll calls per frame is real time taken away from
     hands.send() — which is what made tracking lag behind fast motion. */
  let NODES=null;
  function nodes(){
    if(NODES) return NODES;
    NODES={};
    document.querySelectorAll('[data-eng]').forEach(el=>{
      const k=el.getAttribute('data-eng');
      (NODES[k]||(NODES[k]=[])).push(el);
    });
    return NODES;
  }
  const V=s=>{ const l=nodes()[s]; return l&&l[0]; };
  const ALL=s=>nodes()[s]||[];

  /* the engine caches #video at parse time, so Cam adopts those same elements
     rather than making its own — one camera, one canvas, drawn on by the engine */
  Cam.make=function(){
    if(this.video) return;
    const v=$$('video'), c=$$('cv');
    /* object-fit must stay `cover`: draw() compensates for that crop with
       Math.max(w/vw,h/vh) and only switches to contain when body.fit-contain is
       set, which is the engine's own "Full camera view" setting. */
    const keepT=v.style.transform;   /* startStream() sets the mirror transform */
    v.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0';
    if(keepT) v.style.transform=keepT;
    c.style.cssText='position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none';
    this.video=v; this.canvas=c;
  };
  /* the engine already knows how to open the camera (facing mode, flip, the
     MediaPipe warm-up frame), so defer to it instead of a second getUserMedia */
  Cam.start=function(){
    this.make();
    if(this.stream) return Promise.resolve(true);
    if(this._inflight) return this._inflight;
    this._inflight=(async()=>{
      try{
        /* boot() downloads MediaPipe and only THEN constructs `hands`. Starting
           the pump before that means every frame throws inside pump()'s catch
           and nothing is ever recognised — which looks exactly like a camera
           that works but detects nothing. Wait for the engine's own ready
           signal (it enables #start) before feeding it anything. */
        await engineReady();
        await startStream();
        running=true;
        /* pump() re-schedules itself with requestAnimationFrame unconditionally,
           so the loop outlives `running` — it idles rather than stopping. Call
           it exactly once per page: calling it again spawns a SECOND loop, and
           the loops then race on the shared `sending` flag and hand MediaPipe
           frames out of order, which is what made tracking glitch. */
        if(!Cam._pumping){ Cam._pumping=true; pump(); }
        this.stream=this.video.srcObject;
        this.ready=true; this.perm='granted'; this.clearPrompts();
        return true;
      }catch(e){
        this.ready=false; this.err=e;
        if(e && /NotAllowed|Permission|Denied/i.test((e.name||'')+(e.message||''))) this.perm='denied';
        return false;
      }finally{ this._inflight=null; }
    })();
    return this._inflight;
  };
  Cam.stop=function(){
    /* deliberately does NOT clear Cam._pumping: the rAF loop is still alive and
       idling, so a later start() must not launch a second one */
    try{ running=false; }catch(e){}
    if(this.stream){ this.stream.getTracks().forEach(t=>t.stop()); this.stream=null; }
    if(this.video) this.video.srcObject=null;
    this.ready=false;
  };
  Cam.idle=function(){
    try{ running=false; }catch(e){}          /* stop feeding MediaPipe immediately */
    if(this.stream) this.stream.getTracks().forEach(t=>t.enabled=false);
    clearTimeout(this._idleT);
    this._idleT=setTimeout(()=>this.stop(), this.IDLE_MS);
  };
  Cam.wake=function(){
    clearTimeout(this._idleT);
    if(this.stream){ this.stream.getTracks().forEach(t=>t.enabled=true);
      /* set the flag only — the loop from Cam.start() is still alive and will
         pick straight back up. Starting another here was the glitch. */
      try{ running=true; }catch(e){} }
  };


  /* ---- fili -------------------------------------------------------------
     The design cycles the chevrons on a CSS loop as a mockup; those loops are
     stripped at build time so the real detector owns them. The engine keeps
     the state on the hidden #filiCue / #filiPad, including a --p progress
     value on whichever direction is being held. */
  const GLYPH={up:'↑',right:'→',down:'↓',left:'←'};
  function mirrorFili(){
    const cue=$$('filiCue'), pad=$$('filiPad');
    const cueOn = cue && cue.classList.contains('on');
    ALL('filicue').forEach(el=>{
      el.style.opacity = cueOn ? '1' : '0';
      el.style.transition='opacity .25s';
    });
    const msg=$$('fcMsg');
    if(msg) ALL('filimsg').forEach(el=>{
      if(el.textContent!==msg.textContent) el.textContent=msg.textContent;
    });
    /* #fcArr can hold SEVERAL arrows at once — a locked letter often accepts
       more than one fili direction — so light every one it names, not just the
       first. Lighting only one is why the chevron looked wrong. */
    const arr=$$('fcArr'), txt=arr?(arr.textContent||''):'';
    ['up','right','down','left'].forEach(d=>{
      const on = txt.indexOf(GLYPH[d])>=0;
      ALL('fcarr'+d).forEach(el=>{ el.style.opacity = on ? '1' : '0'; });
    });
    /* sukun and obofili are depth gestures — push/pull rather than a heading —
       and the engine routes them through padDir='mid'. The centre cell is now
       driven from .act + --p in the loop above, same as any direction, so it
       fills as you hold instead of only blinking on. */
    const padOn = pad && pad.classList.contains('on');
    ALL('filipad').forEach(el=>{
      el.style.opacity = padOn ? '1' : '.35';
      el.style.transition='opacity .25s';
    });
    if(!pad) return;
    /* the scaffold is static, so its direction cells are looked up once */
    if(!FP){ FP={}; ['up','left','right','down','mid'].forEach(d=>{ FP[d]=pad.querySelector('.fp.'+d); }); }
    ['up','left','right','down','mid'].forEach(d=>{
      const src=FP[d];
      const act=src && src.classList.contains('act');
      const prog=src ? (src.style.getPropertyValue('--p')||'0') : '0';
      ALL('fp'+d).forEach(el=>{
        if(d==='mid'){
          /* the centre is a dot: scale and glow it rather than filling a cell */
          el.style.transition='color .1s, text-shadow .1s, transform .1s';
          el.style.color = act ? '#6bf61d' : 'rgba(255,255,255,.35)';
          el.style.textShadow = act ? '0 0 12px rgba(107,246,29,.95)' : 'none';
          el.style.transform = act ? 'scale('+(1.4+parseFloat(prog)*1.1).toFixed(2)+')' : 'scale(1)';
          return;
        }
        if(act){
          el.style.color='#0c1a2c'; el.style.fontWeight='800';
          el.style.background='linear-gradient(to top,#6bf61d '+(parseFloat(prog)*100)+'%,rgba(107,246,29,.22) 0)';
        }else{
          el.style.color='rgba(255,255,255,.55)'; el.style.fontWeight='';
          el.style.background='rgba(107,246,29,.18)';
        }
      });
    });
  }


  /* ---- lock + hold feedback ----------------------------------------------
     In index.html the engine's own DOM *is* the UI: it toggles body.sign-locked
     or #holdBar.on and the stylesheet does the rest. Here the design is the UI,
     so each of those signals has to be carried across explicitly — anything not
     bridged simply never appears, which is why the glow and the hold progress
     were missing even though the engine was emitting them all along. */
  let holdEl=null;
  function ensureHoldBar(panel){
    if(holdEl && holdEl.parentNode===panel && holdEl.isConnected) return holdEl;
    holdEl=panel.querySelector('.engHold');
    if(!holdEl){
      holdEl=document.createElement('div');
      holdEl.className='engHold';
      holdEl.style.cssText='position:absolute;left:0;right:0;bottom:0;height:4px;'+
        'background:rgba(0,0,0,.4);z-index:5;opacity:0;transition:opacity .28s;pointer-events:none';
      holdEl.innerHTML='<i style="display:block;height:100%;width:100%;transform:scaleX(0);'+
        'transform-origin:left center;background:#6bf61d;box-shadow:0 0 10px 1px rgba(107,246,29,.75);'+
        'transition:transform .09s linear"></i>';
      panel.appendChild(holdEl);
    }
    return holdEl;
  }
  function mirrorFeedback(){
    const panel=panelRefs();
    if(!panel) return;
    const locked=document.body.classList.contains('sign-locked');

    /* the ring: the engine's own lockPulse, on the panel the camera is in */
    if(!RING || !RING.isConnected){
      RING = panel.querySelector('.engRing') || (function(){
        const d=document.createElement('div'); d.className='engRing';
        d.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit';
        panel.appendChild(d); return d;
      })();
    }
    const ring=RING;
    ring.style.animation = locked ? 'recPulse 1.7s ease-in-out infinite' : 'none';

    /* the same lock, pulsing the reading card only — not the whole surface */
    /* deliberately no glow on the reading card: the camera ring and the hand
       skeleton both already signal that a fili can be added, and a third copy
       of the same message on the card was redundant */

    /* hold progress: the engine drives #holdBar .on plus a scaleX on its fill */
    const src=$$('holdBar');
    const bar=ensureHoldBar(panel);
    if(src){
      const on=src.classList.contains('on');
      bar.style.opacity = on ? '1' : '0';
      const fill=src.firstElementChild, mine=bar.firstElementChild;
      if(fill && mine) mine.style.transform = fill.style.transform || 'scaleX(0)';
    }

    /* the fili pad flashes .swept the moment a stroke is committed */
    const pad=$$('filiPad');
    const swept = pad && pad.classList.contains('swept');
    ALL('filipad').forEach(el=>{
      if(swept){
        el.style.borderColor='#6bf61d';
        el.style.boxShadow='0 0 0 1px #6bf61d, 0 0 18px -2px rgba(107,246,29,.65)';
      }else{
        el.style.borderColor='';
        el.style.boxShadow='';
      }
    });
  }



  /* ---- Collect: real sample counts ---------------------------------------
     The design's chips carry mocked numbers (600, 450, ...). The engine holds
     the real per-letter counts and the selected letter, so both are pushed onto
     the design's own chips rather than rebuilding the grid. */
  let lastCounts='';
  function mirrorCollect(){
    const grids=[].slice.call(document.querySelectorAll('[data-eng="capgrid"]'));
    if(!grids.length) return;
    let counts, letters, cur, target;
    try{
      counts=counts0(); letters=LETTERS; cur=curLetter; target=TARGET;
    }catch(e){ return; }
    const key=cur+'|'+letters.map(l=>counts[l[1]]||0).join(',');
    if(key===lastCounts) return;
    lastCounts=key;
    grids.forEach(g=>{
      const chips=g.children;
      for(let i=0;i<chips.length && i<letters.length;i++){
        const nm=letters[i][1], n=counts[nm]||0, done=n>=target, sel=(nm===cur);
        const chip=chips[i];
        const cnt=chip.querySelector('[data-capn]');
        if(cnt && cnt.textContent!==String(n)){
          cnt.textContent=n;
          cnt.style.color = done ? '#6bf61d' : '#77879e';
        }
        chip.style.borderColor = sel ? '#6bf61d' : (done ? 'rgba(107,246,29,.4)' : '#1c2a3c');
        chip.style.background  = sel ? 'rgba(107,246,29,.14)' : 'rgba(255,255,255,.03)';
        const bar=chip.querySelector('span[style*="bottom"]');
        if(bar) bar.style.width = Math.min(100, n/target*100) + '%';
        if(!chip.dataset.capWired){
          chip.dataset.capWired='1';
          chip.addEventListener('click',()=>{ selectLetter(nm); }, true);
        }
      }
    });
  }
  /* the engine picks letters through its own hidden grid; reuse that path so
     selection, counts and the capture button all stay in agreement */
  function selectLetter(nm){
    const g=$$('capGrid');
    if(!g) return;
    const chips=g.querySelectorAll('.cchip');
    let letters; try{ letters=LETTERS; }catch(e){ return; }
    for(let i=0;i<letters.length && i<chips.length;i++){
      if(letters[i][1]===nm){ chips[i].click(); return; }
    }
  }
  function counts0(){ return (typeof counts==='function') ? counts() : {}; }

  /* ---- Collect capture --------------------------------------------------
     The design's Record button ran its own scripted animation. The engine owns
     capture (30 frames, dedup, history, persistence), so the button is pointed
     at it instead. */
  function wireCapture(){
    const btns=[...document.querySelectorAll('[data-act]')].filter(b=>
      /record take|capture/i.test((b.textContent||'').trim()));
    btns.forEach(b=>{
      if(b.dataset.capWired) return;
      b.dataset.capWired='1';
      /* The real capture is now fired by startRecord() at the "sign" moment, so the 3-2-1
         pre-roll leads into it instead of the camera grabbing frames during the countdown.
         (Left wired-flag set so nothing re-attaches the old immediate-click handler.) */
    });
  }

  /* ---- distance slider -> the engine's own control -----------------------
     The engine keeps HMIN and persists it; rather than duplicate that, the
     design's slider drives the engine's #hsRange and reads its live readout. */
  function wireSlider(){
    const r=document.querySelector('[data-eng="hsrange"]');
    const src=$$('hsRange');
    if(!r||!src||r.dataset.wired) return;
    r.dataset.wired='1';
    r.value=src.value;
    r.addEventListener('input',()=>{
      src.value=r.value;
      src.dispatchEvent(new Event('input',{bubbles:true}));
    });
  }
  function mirrorSlider(){
    wireSlider();
    const v=$$('hsVal'), l=$$('hsLive');
    const dv=document.querySelector('[data-eng="hsval"]');
    const dl=document.querySelector('[data-eng="hslive"]');
    if(v&&dv&&dv.textContent!==v.textContent) dv.textContent=v.textContent;
    if(l&&dl&&dl.textContent!==l.textContent) dl.textContent=l.textContent;
    /* the engine only refreshes its live hand-size readout while its own
       settings sheet is open, so ask for it directly */
    try{ if(typeof hsLive==='function') hsLive(); }catch(e){}
  }


  /* ---- fili priming cue ---------------------------------------------------
     The corner skeleton keeps drawing itself as its resting state. It stops and
     holds a steady lime glow only while a fili can be added — so the animation
     ceasing is itself the signal, rather than something to read past. */
  const ALL0=s=>[].slice.call(document.querySelectorAll(s));
  let wasPrimed=null, FP=null;
  function mirrorGlows(){
    const cue=$$('filiCue');
    const primed = !!(cue && cue.classList.contains('on'));
    if(primed!==wasPrimed){
      wasPrimed=primed;
      ALL0('[data-camskel]').forEach(mark=>{
        mark.querySelectorAll('line,circle').forEach(el=>{
          /* buildSkel writes the animation INLINE, so clearing style.animation
             deletes it for good rather than falling back to a stylesheet rule.
             Stash the original once and put that exact string back. */
          if(el.dataset.anim===undefined) el.dataset.anim = el.style.animation || '';
          if(primed){
            el.style.animation='none';
            el.style.opacity='1';
            el.style.strokeDashoffset='0';
            el.style.strokeDasharray='none';
          }else{
            el.style.animation = el.dataset.anim;
            el.style.opacity='';
            el.style.strokeDashoffset='';
            el.style.strokeDasharray='';
          }
        });
        const inner=mark.firstElementChild;
        if(inner) inner.style.filter = primed
          ? 'drop-shadow(0 0 8px rgba(107,246,29,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.95))'
          : 'drop-shadow(0 1px 2px rgba(0,0,0,.95)) drop-shadow(0 0 3px rgba(0,0,0,.85))';
        mark.style.transition='box-shadow .3s';
        mark.style.boxShadow = primed
          ? '0 2px 14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(107,246,29,.75), 0 0 22px -4px rgba(107,246,29,.6)'
          : '0 2px 14px rgba(0,0,0,.55), inset 0 0 0 1px rgba(107,246,29,.22)';
      });
      /* the camera ring carries the same lime pulse */
      const panel=panelRefs();
      if(panel){
        const g=panel.querySelector('.engFili') || (function(){
          const d=document.createElement('div'); d.className='engFili';
          d.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:4;border-radius:inherit';
          panel.appendChild(d); return d;
        })();
        g.style.animation = primed ? 'recPulse 1.5s ease-in-out infinite' : 'none';
      }
    }
  }

  /* ---- settings ----------------------------------------------------------
     The design's popover toggles were only flipping its own state object; the
     engine reads its own checkboxes. Each toggle is pushed onto the matching
     engine input so the setting actually takes effect. */
  const SETTING_IDS=['outputOn','guideOn','filiOn','swapLR','fitOn','lAutoOn','bgOn'];
  function syncSettings(){
    const st = window.ISHAARA && ISHAARA.state && ISHAARA.state.set;
    if(!st) return;
    SETTING_IDS.forEach(id=>{
      if(!(id in st)) return;
      const el=$$(id);
      if(!el || el.checked===!!st[id]) return;
      el.checked=!!st[id];
      el.dispatchEvent(new Event('change',{bubbles:true}));
    });
  }

  /* ---- fili poses on Collect ---------------------------------------------
     SPECIAL is filiV, oaboa (C) and eybey. The engine renders and wires them
     into #specGrid; rather than rebuild that, the element itself is moved into
     the design's slot so its own click handlers keep working. */
  function mountSpecGrid(){
    const slot=document.querySelector('[data-eng="specslot"]');
    const grid=$$('specGrid');
    if(!slot || !grid || grid.parentNode===slot) return;
    slot.appendChild(grid);
    grid.style.cssText='display:grid;grid-template-columns:repeat(3,1fr);gap:6px;direction:rtl';
  }

  /* ---- mirror engine output into the design ---- */
  let last={};
  function put(sel, val, apply){
    if(last[sel]===val) return;
    const el=V(sel); if(!el) return;
    apply(el, val); last[sel]=val;
  }
  let stopped=false, lastSurf=null;
  window.addEventListener('pagehide',()=>{ stopped=true; });
  /* Cached per-frame lookups. These were queried on every tick, which is real
     work on the same callback the engine uses to push frames to MediaPipe. */
  let PANEL=null, RING=null, HOLD=null;
  function panelRefs(){
    if(PANEL && PANEL.isConnected) return PANEL;
    PANEL=document.querySelector('[data-campanel]'); RING=null; HOLD=null;
    return PANEL;
  }
  /* Collect: surface the REAL capture. shapeCap.got is the live 0->30 frame count,
     #pstat carries the engine's "receiving frame N/30 · landmarks · features · classify"
     commentary, and pn0..pn3 are the real pipeline stages. None of this was shown in Collect
     before — the design ran a scripted 3-2-1 animation with a fake counter beside it. */
  let _capPrevGot=-1, _capRateN=0, _capRateT=0, _capLastRate=0, _capLastAdvance=0;
  function mirrorCapture(){
    for(let i=0;i<4;i++){ const n=$$('pn'+i), on=n&&n.classList.contains('on');
      put('pn'+i, on?'1':'0', (el,v)=>{ el.style.background=v==='1'?'#6bf61d':'#2a3b52';
        el.style.boxShadow=v==='1'?'0 0 10px rgba(107,246,29,.6)':'none'; }); }
    const ps=$$('pstat'); const info=(ps&&(ps.textContent||'').trim())||'';
    put('pipeinfo', info, (el,v)=>{ el.innerHTML=v; });
    const cap=(typeof shapeCap!=='undefined')?shapeCap:null;
    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    if(cap){
      const got=cap.got||0;
      if(_capPrevGot<0){ _capRateN=0; _capRateT=now; _capLastAdvance=now; _capLastRate=0; }
      if(got>_capPrevGot){ _capRateN+=(got-Math.max(0,_capPrevGot)); _capLastAdvance=now; }
      _capPrevGot=got;
      const dt=(now-_capRateT)/1000; if(dt>=0.5){ _capLastRate=_capRateN/dt; _capRateN=0; _capRateT=now; }
      const good = now-_capLastAdvance < 250;   // frames still arriving = hand held in view
      put('capactive','1',(el)=>{ el.style.display='flex'; });
      put('capcount', got+'/30', (el,v)=>el.textContent=v);
      put('caprate', Math.round(_capLastRate)+'/s', (el,v)=>el.textContent=v);
      put('capqual', good?'tracking':'hand lost', (el,v)=>{ el.textContent=v; el.style.color=good?'#6bf61d':'#ff9b9b'; });
      put('caprec', Math.round(got/30*100)+'%', (el,v)=>el.style.width=v);
    } else {
      if(_capPrevGot>=0) _capPrevGot=-1;
      put('capactive','0',(el)=>{ el.style.display='none'; });
    }
  }
  /* Collect: what the classifier currently reads the hand as, and whether that agrees with the
     letter being recorded. step() classifies EVERY frame regardless of surface, so #glyph /
     #nowlabel / #conf are already live here — this only mirrors what the engine already computed.
     A collector pointing the camera at the wrong handshape is the single most expensive mistake
     in a dataset, and until now nothing in Collect told them. */
  function lbl(el,key,dflt){ const v=el&&el.getAttribute&&el.getAttribute('data-l-'+key); return v||dflt; }
  function mirrorDetect(){
    const g=$$('glyph'), nl=$$('nowlabel'), c=$$('conf');
    const gl=(g&&(g.textContent||'').trim())||'—';
    const nm=(nl&&(nl.textContent||'').trim())||'';
    let pct=0;
    if(c && c.style.transform){ const m=/scaleX\(([\d.]+)\)/.exec(c.style.transform);
      if(m) pct=Math.max(0,Math.min(1,parseFloat(m[1]))); }
    put('detglyph', gl, (el,v)=>el.textContent=v);
    put('detname', nm||'—', (el,v)=>el.textContent=v);
    put('detconf', Math.round(pct*100)+'%', (el,v)=>el.textContent=v);
    const tgt=(typeof curLetter!=='undefined')?curLetter:null;
    put('detmatch', (tgt||'')+'|'+nm, (el)=>{
      let txt='—', col='#5b6a7e';
      if(tgt && nm){
        if(nm===tgt){ txt=lbl(el,'match','matches target'); col='#6bf61d'; }
        else if(nm==='unknown shape'){ txt=lbl(el,'unclear','unclear'); col='#ffd24a'; }
        else if(nm!=='no data yet'){ txt=lbl(el,'not','not')+' '+tgt; col='#ff9b9b'; }
      }
      el.textContent=txt; el.style.color=col;
    });
    /* A plain-language readiness line. "not haa" tells you the state; it does
       not tell you what will happen if you press record, which is the thing a
       collector actually wants to know before spending a take. */
    put('detready', (tgt||'')+'|'+nm+'|'+(pct>0.35?'1':'0'), (el)=>{
      let txt='', col='#5b6a7e';
      if(!tgt || !nm || nm==='no data yet'){ txt=lbl(el,'wait','waiting for a hand'); }
      else if(nm==='unknown shape'){ txt=lbl(el,'unclear','shape unclear — hold it steady'); col='#ffd24a'; }
      else if(nm===tgt){ txt=lbl(el,'ready','ready to record'); col='#6bf61d'; }
      else if(pct<=0.35){ txt=lbl(el,'weak','reading is weak — move closer or steady the hand'); col='#ffd24a'; }
      else { txt=(lbl(el,'willrefuse','this reads as')+' '+nm+' '+lbl(el,'willrefuse2','— a take now would be refused')); col='#ff9b9b'; }
      el.textContent=txt; el.style.color=col;
    });
  }
  /* Dataset health for the letter being collected. curCounts is the engine's own cached per-label
     tally (refreshed on data change), so the per-letter figures are O(1); devCounts() walks the
     whole sample array, which is why the whole block is throttled rather than run per tick. */
  let _dhT=0;
  if(typeof DEMO!=='undefined' && DEMO) window.__dbgHealthNow=function(){ _dhT=0; };
  /* The engine writes publish progress into its own #pubStatus node; mirror it
     so the designed card reports what is actually happening. */
  function mirrorPublish(){
    const src=$$('pubStatus'); if(!src) return;
    put('pubstatus', (src.textContent||'').trim(), (el,v)=>{
      el.textContent=v;
      el.style.color = /error|fail|enter |awaiting|held back/i.test(v) ? '#ff9b9b'
                     : /up to date|published|done/i.test(v) ? '#6bf61d' : '#8a97a8';
    });
  }
  function mirrorHealth(now){
    if(now-_dhT < 1200) return; _dhT=now;
    const tgt=(typeof curLetter!=='undefined')?curLetter:null;
    const T=(typeof TARGET!=='undefined'&&TARGET)?TARGET:600;
    const cc=(typeof curCounts!=='undefined'&&curCounts)?curCounts:{};
    const n=(tgt&&cc[tgt])||0;
    put('dhcur', n.toLocaleString(), (el,v)=>el.textContent=v);
    put('dhtarget', '/ '+T.toLocaleString(), (el,v)=>el.textContent=v);
    put('dhbar', Math.min(100,Math.round(n/T*100))+'%', (el,v)=>el.style.width=v);
    put('dhstate', n>=T?'g':(n===0?'0':'n:'+(T-n)), (el,v)=>{
      if(v==='0'){ el.textContent=lbl(el,'none','no samples yet'); el.style.color='#ff9b9b'; }
      else if(v==='g'){ el.textContent=lbl(el,'goal','at goal'); el.style.color='#6bf61d'; }
      else { el.textContent=(T-n).toLocaleString()+' '+lbl(el,'need','more needed'); el.style.color='#ffd24a'; }
    });
    const L=(typeof LETTERS!=='undefined'&&LETTERS)?LETTERS:[];
    let atGoal=0; for(let i=0;i<L.length;i++){ if((cc[L[i][1]]||0)>=T) atGoal++; }
    put('dhgoal', atGoal+'/'+L.length, (el,v)=>{ el.textContent=v+' '+lbl(el,'atgoal','letters at goal'); });
    let mix='';
    try{ const dc=devCounts();
      const tot=(typeof data!=='undefined'&&data.handshapes)?data.handshapes.length:0;
      mix='mobile '+dc.m.toLocaleString()+' · desktop '+dc.d.toLocaleString()+' · @'+tot.toLocaleString();
    }catch(e){}
    put('dhmix', mix, (el,v)=>{ el.textContent=v.replace('@', '')+(v?' '+lbl(el,'total','samples total'):''); });

    /* Per-letter device split. Collected on one kind of device, a letter will
       work on that kind of device — so this is shown for the letter in hand,
       not only as a dataset-wide total. */
    try{
      const dl=(typeof devCountsFor==='function'&&tgt)?devCountsFor(tgt):{m:0,d:0};
      const tt=dl.m+dl.d;
      put('dhdevbar', tt?String(Math.round(dl.m/tt*100)):'-', (el,v)=>{
        el.style.width = (v==='-'?0:v)+'%';
      });
      put('dhdevtxt', tt?(dl.m+'|'+dl.d):'0|0', (el,v)=>{
        const [m,d]=v.split('|').map(Number);
        const t2=m+d;
        el.textContent = t2
          ? (m.toLocaleString()+' '+lbl(el,'mob','phone')+'  ·  '+d.toLocaleString()+' '+lbl(el,'desk','computer'))
          : lbl(el,'none','nothing collected yet');
        /* One-sided collection is worth flagging: it is the difference between a
           letter that works everywhere and one that works on your laptop. */
        el.style.color = (!t2) ? '#5b6a7e' : (m===0||d===0) ? '#ffd24a' : '#77879e';
      });
      put('dhdevwarn', (tt && (dl.m===0||dl.d===0)) ? (dl.m===0?'d':'m') : '', (el,v)=>{
        el.textContent = v==='d' ? lbl(el,'nomob','no phone samples for this letter yet')
                       : v==='m' ? lbl(el,'nodesk','no computer samples for this letter yet') : '';
        el.style.display = v?'block':'none';
      });
    }catch(e){}
  }
  /* Learn practice was faking it: tapping the camera toggled a "matched" state
     and the panel showed a hardcoded 94%. A learner could pass every letter
     without ever making a correct shape, which is the one thing this surface
     exists to check.
     step() classifies every frame regardless of surface, so #nowlabel and #conf
     already hold a real answer here. This reads them, compares against the
     letter being practised, and only calls it matched once the right letter has
     been held for a moment, so a shape flashing past mid-transition does not
     count. */
  let _lrnEv=0, _lrnT=0, _lrnDone=false, _lrnFor='', _lrnNextT=0;
  function mirrorLearn(){
    const app=window.ISHAARA; if(!app) return;
    const st=app.state; if(st.surface!=='learn'||st.learnMode!=='practice') return;
    const target=(app.LETTERS&&app.LETTERS[st.learnIdx])?app.LETTERS[st.learnIdx].nm:null;
    if(!target) return;
    if(target!==_lrnFor){ _lrnFor=target; _lrnEv=0; _lrnT=0; _lrnDone=false; clearTimeout(_lrnNextT); }

    /* Keep the ghost flipped the same way the video is. The front camera is
       mirrored so your own movements feel correct, and a guide that is not
       mirrored with it asks you to match a right hand using your left. The
       engine flips this per camera (facing==='user'), so read the video rather
       than assuming. */
    try{
      const vid=document.querySelector('[data-campanel] video')||document.querySelector('video');
      const flipped = vid ? /scaleX\(-1\)/.test(vid.style.transform||'') : true;
      put('learnmirror', flipped?'1':'0', ()=>{
        document.querySelectorAll('[data-learnguide]').forEach(el=>{
          el.style.transform = flipped ? 'scaleX(-1)' : 'none';
        });
      });
    }catch(e){}

    const nl=$$('nowlabel'), c=$$('conf');
    const name=(nl&&(nl.textContent||'').trim())||'';
    let pct=0;
    if(c&&c.style.transform){ const m=/scaleX\(([\d.]+)\)/.exec(c.style.transform);
      if(m) pct=Math.max(0,Math.min(1,parseFloat(m[1]))); }

    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    const dt=Math.min(200, _lrnT?now-_lrnT:33); _lrnT=now;

    /* Evidence, not a stopwatch.
       The first version demanded an unbroken 600ms of exact match. Classification
       flickers frame to frame, so a single stray frame reset the timer and the
       match effectively never landed: it looked like nothing was happening.
       This accrues while the right letter is showing and drains more slowly when
       it is not, so brief flicker costs a little progress instead of all of it.
       Same approach the engine already uses to commit a letter lock. */
    const right = name===target && pct>=0.45;
    _lrnEv += right ? (dt/700) : -(dt/1100);
    if(_lrnEv<0) _lrnEv=0; if(_lrnEv>1) _lrnEv=1;
    const held = _lrnEv>=1;

    put('learnpct', Math.round(pct*100)+'%', (el,v)=>el.textContent=v);
    /* the bar shows progress towards the match, not raw confidence: it has to
       visibly fill as you hold the shape, or there is no sign anything is
       happening */
    put('learnbar', Math.round(_lrnEv*100)+'%', (el,v)=>el.style.width=v);
    put('learnstate', right?(held?'match':'close'):(name&&name!=='no data yet'?'wrong':'looking'),
      (el,v)=>{ el.setAttribute('data-state',v); });

    /* the readout keeps updating after a match, so the figure on the success
       panel is the confidence that actually earned it rather than a reset 0 */
    if(!st.learnMatched && _lrnDone){ _lrnDone=false; _lrnEv=0; }
    if(_lrnDone) return;
    if(held && !st.learnMatched){
      _lrnDone=true;
      /* Celebrate AFTER the state change, not before. setState replaces the
         whole DOM, so a class added first is wiped by the very next render and
         nothing animates. Marking the fresh card on the next frame is what
         actually shows. */
      /* The pulse class is applied by the template itself, keyed on learnMatched,
         so it arrives with the render that shows the match. Setting it from here
         raced the render and was wiped before it could animate. */
      app.setState({learnMatched:true});
      /* "Auto-advance on match" was already listed in Learn's settings but
         nothing implemented it. The pause is deliberate: moving on the instant
         the bar fills hides the confirmation the learner just earned. */
      if(app.state.set && app.state.set.lAutoOn){
        clearTimeout(_lrnNextT);
        _lrnNextT=setTimeout(()=>{
          const a=window.ISHAARA; if(!a) return;
          if(a.state.surface!=='learn'||a.state.learnMode!=='practice') return;
          if(!a.state.learnMatched) return;          // already moved on by hand
          const v=a.renderVals();
          if(v && typeof v.learnNext==='function') v.learnNext();
        },1500);
      }
    }
  }

  /* Quiz, sign-it mode. Same evidence model as Learn: the classifier flickers,
     so an unbroken timer would rarely complete. Thresholds follow index.html,
     which used 0.55 confidence held for 750ms. */
  let _qEv=0, _qT=0, _qFor=-1;
  function mirrorQuiz(){
    const app=window.ISHAARA; if(!app) return;
    const st=app.state;
    if(st.surface!=='learn'||st.learnMode!=='quiz'||st.qMode!=='play') return;
    if(!st.set||!st.set.qSignOn) return;                 // multiple choice is answered by tapping
    if(!st.qQueue||!st.qQueue.length) return;
    const target=(app.LETTERS[st.qQueue[st.qIdx]]||{}).nm;
    if(!target) return;
    if(st.qIdx!==_qFor){ _qFor=st.qIdx; _qEv=0; _qT=0; }

    const nl=$$('nowlabel'), c=$$('conf');
    const name=(nl&&(nl.textContent||'').trim())||'';
    let pct=0;
    if(c&&c.style.transform){ const m=/scaleX\(([\d.]+)\)/.exec(c.style.transform);
      if(m) pct=Math.max(0,Math.min(1,parseFloat(m[1]))); }

    const now=(typeof performance!=='undefined'?performance.now():Date.now());
    const dt=Math.min(200,_qT?now-_qT:33); _qT=now;
    const right = name===target && pct>=0.55;
    _qEv += right ? (dt/750) : -(dt/1100);
    if(_qEv<0) _qEv=0; if(_qEv>1) _qEv=1;

    put('quizpct', Math.round(pct*100)+'%', (el,v)=>el.textContent=v);
    put('quizbar', Math.round(_qEv*100)+'%', (el,v)=>el.style.width=v);

    if(_qEv>=1){
      _qEv=0; _qFor=-1;
      try{ app.qAnswer(true); }catch(e){}
      requestAnimationFrame(()=>{
        try{
          /* The surface card fills the viewport, so a ring on it reads as the whole
             screen flashing. Pulse the camera — that is where the win happened. */
          const card=document.querySelector('[data-campanel]')||document.querySelector('[data-surfcard]');
          if(card){ card.classList.remove('qwin'); void card.offsetWidth; card.classList.add('qwin'); }
        }catch(e){}
      });
    }
  }

  function tick(){
    /* the loop outlives the page during teardown; bail rather than touch a
       document that is being dismantled */
    if(stopped || typeof document==='undefined' || !document || !document.body) return;
    const surf = window.ISHAARA && ISHAARA.state.surface;
    if(surf==='review') mirrorPublish();
    mirrorSlider();
    /* Collect-only wiring: it only needs doing when the surface changes or the
       app re-renders, not on every tick — re-querying here was pure overhead */
    if(surf==='collect' && lastSurf!==surf){ mountSpecGrid(); wireCapture(); lastCounts=''; }
    if(surf==='collect') mirrorCollect();
    lastSurf=surf;
    syncSettings();
    if(surf==='learn'){ mirrorLearn(); mirrorQuiz(); }
    /* replaces the invented "SESSION_04 · signer_A" with what is actually true */
    if(surf==='collect'){
      try{
        const n=(typeof data!=='undefined'&&data.handshapes)?data.handshapes.length:0;
        put('devinfo', n+'|'+(typeof MOBILE!=='undefined'&&MOBILE?'m':'d'), (el,v)=>{
          const [c,d]=v.split('|');
          el.textContent=(+c).toLocaleString()+' samples on this '+(d==='m'?'phone':'computer');
        });
      }catch(e){}
    }
    if(surf==='collect'){ mirrorCapture(); mirrorDetect();
      mirrorHealth(typeof performance!=='undefined'?performance.now():Date.now()); }
    if(surf==='recognise'){
      const g=$$('glyph'), c=$$('conf'), o=$$('out');
      /* the engine renders the letter into #glyph and the confidence as a
         scaleX transform on #conf */
      put('glyph', (g&&g.textContent)||'—', (el,v)=>el.textContent=v);
      let pct=0;
      if(c && c.style.transform){
        const m=/scaleX\(([\d.]+)\)/.exec(c.style.transform);
        if(m) pct=Math.max(0,Math.min(1,parseFloat(m[1])));
      }
      put('conf', pct.toFixed(2), (el,v)=>el.textContent=v);
      put('confbar', (pct*100).toFixed(1)+'%', (el,v)=>el.style.width=v);
      put('out', (o&&o.textContent)||'', (el,v)=>el.textContent=v);
      for(let i=0;i<4;i++){
        const n=$$('pn'+i), on=n&&n.classList.contains('on');
        put('pn'+i, on?'1':'0', (el,v)=>{
          el.style.background = v==='1' ? '#6bf61d' : '#2a3b52';
          el.style.boxShadow  = v==='1' ? '0 0 10px rgba(107,246,29,.6)' : 'none';
        });
      }
      /* the engine's running commentary, plus the phase and the live hand
         size — the numbers that tell you WHY it is or is not reading you */
      const ps=$$('pstat'), chip=$$('chip'), hint=$$('hint');
      let info = (ps && (ps.textContent||'').trim()) || '';
      const phase = chip && (chip.textContent||'').trim();
      const hs = (typeof lastHandScale!=='undefined' && lastHandScale)
                 ? lastHandScale.toFixed(3) : null;
      const bits=[];
      if(phase && phase!=='—') bits.push(phase.toUpperCase());
      if(info) bits.push(info);
      if(hs) bits.push('hand '+hs);
      if(typeof HMIN!=='undefined') bits.push('min '+HMIN.toFixed(3));
      const line=bits.join('  ·  ');
      put('pipeinfo', line, (el,v)=>{ el.innerHTML=v; });
      mirrorFili();
      mirrorFeedback();
      mirrorSlider();
      mirrorGlows();
    }
    }
  /* Deliberately NOT requestAnimationFrame. rAF callbacks run before paint, on
     the same frame the engine uses to call hands.send(); anything done here
     delays that send and costs tracking frames, which shows up as the skeleton
     lagging the hand during fast motion. A 40ms timer is smooth enough for a
     readout and stays off the critical path. */
  setInterval(tick, 40);

  /* ?diag — layout ground truth from a real device.
     Mobile overflow bugs do not reproduce in a desktop emulator or in jsdom, so rather than
     guess from a screenshot this reports what the phone actually has: the viewport it thinks
     it is, whether the mobile branch was taken, and every element wider than the screen,
     worst first. Off unless asked for. */
  if(/[?&]diag\b/.test(location.search)){
    const box=document.createElement('div');
    box.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:rgba(4,8,15,.96);'+
      'border-top:1px solid #6bf61d;color:#e6edf6;font:11px/1.5 ui-monospace,Menlo,monospace;'+
      'padding:10px 12px;max-height:44vh;overflow:auto;white-space:pre-wrap';
    document.body.appendChild(box);
    const scan=()=>{
      const vw=document.documentElement.clientWidth;
      const over=[];
      document.querySelectorAll('#app *').forEach(el=>{
        const r=el.getBoundingClientRect();
        if(r.width>vw+1 || r.right>vw+1){
          over.push({w:Math.round(r.width), right:Math.round(r.right),
            tag:el.tagName.toLowerCase()+(el.getAttribute('data-eng')?'[data-eng='+el.getAttribute('data-eng')+']':''),
            txt:(el.textContent||'').trim().slice(0,28)});
        }
      });
      over.sort((a,b)=>b.right-a.right);
      const st=window.ISHAARA&&ISHAARA.state;
      box.textContent=
        'viewport   '+vw+' css px   ·  window.innerWidth '+window.innerWidth+'\n'+
        'screen     '+screen.width+'x'+screen.height+'  dpr '+(window.devicePixelRatio||1)+'\n'+
        'mobile?    matchMedia(max-width:820px) = '+window.matchMedia('(max-width:820px)').matches+
          '   app thinks: '+(st?st.device:'?')+'\n'+
        'surface    '+(st?st.surface:'?')+'\n'+
        'body scrollWidth '+document.body.scrollWidth+'  (over by '+(document.body.scrollWidth-vw)+')\n'+
        'computed h1 font-size '+(()=>{const h=document.querySelector('#app h1');
          return h?getComputedStyle(h).fontSize:'—';})()+'\n'+
        '\nelements wider than the screen: '+over.length+'\n'+
        over.slice(0,12).map(o=>'  w'+String(o.w).padStart(5)+'  right'+String(o.right).padStart(5)+'  '+o.tag+'  '+o.txt).join('\n');
    };
    scan();
    setInterval(scan,1000);
    window.addEventListener('resize',scan);
  }

  /* a render swaps the nodes out, so the cache has to go with them */
  const _render=ISHAARA.render.bind(ISHAARA);
  ISHAARA.render=function(){ _render(); last={}; NODES=null; PANEL=null; RING=null; HOLD=null; holdEl=null; lastSurf=null;
    /* the grid is rebuilt from the design's own state on every render, so the
       change-detection cache has to go with it or the real counts never
       get re-applied */
    lastCounts=''; FP=null;
    /* The dataset readouts are on a 1.2s throttle because they walk the whole
       dataset. Fresh nodes come out of the template empty, so leaving the
       throttle running means the health line, the device split and the letter
       counts sit blank for over a second after every single state change —
       opening settings, picking a letter, switching tab. Re-arm it instead. */
    _dhT=0; };
})();

</script>
</body>
</html>
